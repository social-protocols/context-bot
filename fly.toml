app = "context-bot-social-protocols"
primary_region = "ewr"
# Fly's default kill_signal is SIGINT, which the BEAM does not drain. SIGTERM
# starts OTP shutdown so Oban can finish in-flight research/reply. kill_timeout
# max is 300s, equal to ANTHROPIC_HTTP_TIMEOUT_MS; startup recovery still waits
# out or replaces a sent-without-envelope attempt if the VM is hard-killed.
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
  dockerfile = "Dockerfile"

[env]
  # Supply the real public identity before activation. Empty values are safe
  # while BOT_ENABLED remains false and deliberately fail startup when enabled.
  BOT_ENABLED = "true"
  BOT_DID = "did:plc:anbhmngzs3exwbq47xxzogk4"
  BOT_HANDLE = "getcontext.bot"
  BOT_PDS_URL = "https://rhizopogon.us-west.host.bsky.network"
  DATABASE_PATH = "/data/context_bot.db"
  # The homepage is reachable via the fly.dev host below. Serving https://getcontext.bot
  # (the bot's Bluesky handle and site.standard.publication domain) requires DNS configuration
  # and is not included in this deployment.
  PHX_HOST = "context-bot-social-protocols.fly.dev"
  PHX_SERVER = "true"
  PORT = "4000"
  POOL_SIZE = "5"

  # External service locations, polling bounds, and request timeouts.
  # Exact reviewed trust root. Poll bounds are 5s..1h and 1..20 pages.
  APPVIEW_URL = "https://api.bsky.app"
  POLL_INTERVAL_MS = "30000"
  NOTIFICATION_PAGE_CAP = "5"
  ATPROTO_HTTP_TIMEOUT_MS = "15000"
  ATPROTO_SESSION_TIMEOUT_MS = "15000"
  THREAD_FETCH_TIMEOUT_MS = "20000"

  # Eligibility tiers and admission. Operator DIDs skip actor hourly/daily
  # windows. Elders and verified bsky.team use ACTOR_DAILY_LIMIT. Everyone
  # else, including a labeler/identity outage, uses ACTOR_DAILY_LIMIT_PUBLIC.
  # ACTOR_HOURLY_LIMIT is a burst cap; daily tiers are the actor cap.
  OPERATOR_ALLOWED_DIDS = "did:plc:33avz2l7y5scw3abq3lmylns"
  THREAD_PARENT_HEIGHT = "80"
  ACTOR_HOURLY_LIMIT = "2"
  ACTOR_DAILY_LIMIT = "5"
  ACTOR_DAILY_LIMIT_PUBLIC = "1"
  GLOBAL_HOURLY_LIMIT = "10"
  GLOBAL_DAILY_LIMIT = "50"
  MAX_PENDING = "25"
  QUEUE_CONCURRENCY = "1"

  # Anthropic request, tool, retry, retention, and budget bounds.
  ANTHROPIC_MODEL_ID = "claude-sonnet-5"
  ANTHROPIC_EFFORT = "medium"
  ANTHROPIC_HTTP_TIMEOUT_MS = "300000"
  ANTHROPIC_API_VERSION = "2023-06-01"
  ANTHROPIC_WEB_SEARCH_TOOL_TYPE = "web_search_20260318"
  ANTHROPIC_WEB_FETCH_TOOL_TYPE = "web_fetch_20260318"
  ANTHROPIC_RESEARCH_MAX_TOKENS = "8192"
  ANTHROPIC_LENGTH_REPAIR_MAX_TOKENS = "1024"
  MAX_WEB_SEARCH_USES = "5"
  MAX_WEB_FETCH_USES = "8"
  MAX_WEB_FETCH_CONTENT_TOKENS = "10000"
  MAX_TOOL_CONTINUATIONS = "1"
  ANTHROPIC_MAX_HTTP_RETRIES = "2"
  ANTHROPIC_RETRY_BASE_MS = "1000"
  ANTHROPIC_RETRY_MAX_MS = "30000"
  ANTHROPIC_RESPONSE_MAX_BYTES = "8000000"
  PROVIDER_RESPONSE_STORAGE_MAX_BYTES = "64000000"
  ANTHROPIC_DAILY_BUDGET_USD = "20.000000"
  ANTHROPIC_RESEARCH_RESERVATION_USD = "5.000000"
  ANTHROPIC_CONTINUATION_RESERVATION_USD = "5.000000"
  ANTHROPIC_REPAIR_RESERVATION_USD = "5.000000"
  ANTHROPIC_RETRY_RESERVATION_USD = "5.000000"
  ANTHROPIC_PRICING_VERSION = "sonnet-5-2026-07-28"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "context_bot_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
