app = "context-bot-jwarden"
primary_region = "den"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/context_bot.db"
  PHX_HOST = "context-bot-jwarden.fly.dev"
  PHX_SERVER = "true"
  PORT = "4000"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "context_bot_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
