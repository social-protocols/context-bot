name: CI

# Quality and tests run on PRs targeting main, not on push to main.
# After squash+fast-forward, Deploy (deploy.yml) is the only post-merge job.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '28.5'

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          
      - name: Install shfmt
        run: |
          curl -Lo shfmt https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/

      - name: Install just
        run: |
          curl -fsSL -o just.tar.gz https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf just.tar.gz just
          sudo install -m 0755 just /usr/local/bin/just
          just --version

      - name: Cache Mix dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: just setup

      - name: Check formatting
        run: just format-check

      - name: Compile with warnings as errors
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Run linters
        run: just lint

      - name: Run tests
        run: just test

      - name: Run type checker
        run: just typecheck
